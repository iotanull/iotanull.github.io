<link rel="icon" href="{{ "/favicon.svg" | relURL }}" type="image/svg+xml">
<meta name="color-scheme" content="light dark">
{{- with site.Params.socialImage }}
<meta property="og:image" content="{{ . | absURL }}">
<meta name="twitter:card" content="summary_large_image">
{{- end }}
{{- if .Params.math }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});"></script>
{{- end }}
{{- if eq .Section "books" }}
<script type="application/ld+json">
{{ dict "@context" "https://schema.org" "@type" "Book" "name" .Title "author" (.Params.author | default site.Params.author) "description" .Description "url" .Permalink | jsonify | safeJS }}
</script>
{{- end }}
