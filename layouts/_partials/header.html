<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header">
  <nav class="site-nav" aria-label="Primary navigation">
    <a class="site-mark" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }} home">{{ site.Title }}</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu">
      <span class="menu-toggle-label">Menu</span>
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="nav-actions" id="site-menu">
      <ul class="menu-list">
        {{- $current := . }}
        {{- range site.Menus.main }}
          {{- $menuURL := .URL | relLangURL }}
          {{- $active := or (eq $current.RelPermalink $menuURL) (and (ne $menuURL "/") (hasPrefix $current.RelPermalink $menuURL)) }}
          <li><a href="{{ .URL | relLangURL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme">
        <svg class="moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
        <svg class="sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </nav>
</header>
