{{ define "main" }}
<header class="page-intro art-intro"><p class="eyebrow">Selected work</p><h1>{{ .Title }}</h1><p>{{ .Description }}</p>
{{ with site.Params.portfolioURL }}<p><a class="portfolio-link" href="{{ . }}">View full portfolio <span aria-hidden="true">↗</span></a></p>{{ else }}<p class="portfolio-pending">Full portfolio link can be added in site configuration.</p>{{ end }}
</header>
<div class="art-grid" role="list">
{{ range $index, $work := hugo.Data.artworks }}
  <div role="listitem"><button class="art-thumb" type="button" data-art-index="{{ $index }}" data-title="{{ $work.title }}" data-year="{{ $work.year }}" data-medium="{{ $work.medium }}" data-image="{{ if $work.image }}{{ $work.image | relURL }}{{ end }}" aria-label="Open {{ $work.title }}">
    {{ if $work.thumb }}<img src="{{ $work.thumb | relURL }}" alt="{{ $work.title }}" loading="lazy">{{ else }}<span class="art-placeholder" aria-hidden="true"><span>{{ printf "%02d" (add $index 1) }}</span></span>{{ end }}
    <span class="art-thumb-title">{{ $work.title }}</span>
  </button></div>
{{ end }}
</div>
<dialog class="lightbox" id="art-lightbox" aria-labelledby="lightbox-title">
  <div class="lightbox-shell">
    <button class="lightbox-close" type="button" aria-label="Close artwork viewer">×</button>
    <button class="lightbox-prev" type="button" aria-label="Previous artwork">←</button>
    <div class="lightbox-stage">
      <img class="lightbox-image" src="" alt="">
      <div class="lightbox-placeholder" aria-hidden="true"><span></span></div>
      <div class="lightbox-caption"><h2 id="lightbox-title"></h2><p></p></div>
    </div>
    <button class="lightbox-next" type="button" aria-label="Next artwork">→</button>
  </div>
</dialog>
{{ end }}
